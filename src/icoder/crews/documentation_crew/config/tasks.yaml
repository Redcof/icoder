documentation_task:
  description: >
    Generate a Google-style docstring for the following {language} source code.
    Rules:
    - Generate module, class and function docstring if applicable
    - Include Args, Returns, Raises sections if applicable
    - Be concise but accurate
    - Add module docstring if not present
    - Output ONLY the source code content
    - Never output any explanation or additional interim details while sending result
    - Output only the source code, ready to paste into a file
    
    Source code:
    {source_code}
  expected_output: >
    A structured content (JSON) with modified source code content.
  agent: documentation_specialist

