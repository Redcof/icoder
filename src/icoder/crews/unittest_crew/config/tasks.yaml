testing_task:
  description: >
    Generate {test_framework} unit tests for the following {language} function.
    Rules:
    - Use {test_framework} conventions (no unittest classes unless the source uses them)
    - Include at least: one happy path, one edge case, one error/exception test if applicable
    - Refer existing unit tests to identify the missing or insufficient test cases
    - Use descriptive test function names (test_<function>_<scenario>)
    - Add explainable and accurate docstring to the test cases
    - Add mocks/patches where external dependencies are involved
    - Add module import properly using source path
    {special_rule}
    - Output only the test code, ready to paste into a test file

    Source path: "{source_path}"

    Source code:
    {source_code}
    
    Existing unit tests:    
    {unittest_code}

  expected_output: >
    A structured content (JSON) with the generated unittest source code.
  agent: test_engineer

