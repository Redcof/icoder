testing_task:
  description: >
    Generate pytest-compatible unit tests for all functions identified 
    in the python source code. Focus on edge cases and logic branches to maximize coverage.
    Do not miss any function or class that requires testing. 
    Ensure that the generated tests are robust and can effectively identify potential issues in the code.

    Here is python source code to:

    {source_code}
  expected_output: >
    A structured content (JSON) with the generated unittest source code.
  agent: test_engineer

