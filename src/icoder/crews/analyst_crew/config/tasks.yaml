manager_task:
  description: >
    As the project manager, your task is to coordinate the efforts of the 
    code_analyzer, documentation_specialist, and test_engineer agents. 
    Ensure that the analysis_task is completed before triggering the 
    documentation_task and testing_task. Monitor progress and resolve any 
    blockers that arise during the process. 
    Scan the entire codebase at {codebase_path}. Identify Python files, 
    using file_explorer_tool. The file explorer tool returns a python filepath 
    everytime it is being called. Once you have a filepath, assign it to code_analyzer for analysis. 
    Do not call the file explorer tool unless a choosen file has been processed to the fullest.
    The file explorer tool will return and empty string while all files has been explored.
    Scan the entire codebase at {codebase_path}.
    Do not call the file_explorer_tool unless a selected filepath has been processed to the fullest.
    The file explorer tool will return and empty string while all files has been explored.
    For missing unittest solutions, hand over to testing_task.
  expected_output: >
    A well-coordinated workflow where each agent completes their tasks in 
    sequence, leading to improved code quality through comprehensive analysis, 
    documentation, and testing.
  agent: manager

analysis_task:
  description: >
    For a input python filepath analyze its structure, and list 
    functions/classes missing docstrings or needing unit tests.
    For missing docstring solutions, hand over to documentation_task.
    For missing unittest solutions, hand over to testing_task.
    The documentation_task and testing_task will report back to you once they have completed their tasks with 
    OK or ERROR status.
    You are responsible for communicating with documentation_task and testing_task to 
    ensure they have the necessary context and information 
    to complete their tasks effectively. Once documentation_task and testing_task have completed their tasks, 
    you will notify manager_task with the status.
  expected_input: >
    A Python file path provided by the manager_task for analysis.
  expected_output: >
    A structured report (JSON) mapping with filepath to specific functions/classes 
    requiring documentation or test coverage.
  agent: code_analyzer

documentation_task:
  description: >
    Using the analysis report, generate high-quality Google-style docstrings 
    for all identified functions and classes. Ensure technical accuracy 
    based on the function's logic.
  expected_output: >
    A structured report (JSON) mapping with filepath, a boolean status (True/False) and message.
    True if the documentation has been generated successfully, False otherwise. The message should provide details on any errors encountered during the documentation generation process.
     For example: 
     {
        "filepath": "src/example.py",
        "status": True,
        "message": "Docstrings generated successfully for all functions and classes."
     }
  agent: documentation_specialist
  context: [analysis_task]

testing_task:
  description: >
    Generate pytest-compatible unit tests for all functions identified 
    in the analysis. Focus on edge cases and logic branches to maximize coverage.
    You first locate the test file corresponding to the source file using test_case_explorer tool. 
    Create missing test cases that mirrors the source file directory structure.
    Focus on edge cases and logic branches to maximize coverage. Finally, write all newly generated and updated test 
    cases to the identified test file using FileWriteTool. For a given source file from analysis_task, 
    using test_case_explorer identify the test filepath. Using FileReadTool read the testfile. Create missing 
    test cases that mirrors the source file structure. Focus on edge cases and logic branches to maximize coverage.
    Using FileWriteTool write all newly generated and updated test cases to the identified test file.
  expected_input: >
    A structured report (JSON) mapping full filepath to specific functions/classes 
    requiring test coverage, along with the original source filepath for context.
  expected_output: >
    A structured report (JSON) mapping with filepath, a boolean status (True/False) and message.
    True if the unittest has been generated successfully, False otherwise. 
    The message should provide details on any errors encountered during the unittest generation process.
     For example:
     {
        "filepath": "src/example.py",
        "status": True,
        "message": "Unit tests generated successfully for all functions and classes."
     }
  agent: test_engineer
  context: [analysis_task]

